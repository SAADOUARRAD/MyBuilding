spring.application.name=api-gateway
server.port=8080
spring.config.import=configserver:http://localhost:8888

# Discovery locator dynamique
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes directes par défaut (/api/**)
spring.cloud.gateway.routes[0].id=route-residents
spring.cloud.gateway.routes[0].uri=lb://service-residents
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/residents/**,/api/apartments/**

spring.cloud.gateway.routes[1].id=route-incidents
spring.cloud.gateway.routes[1].uri=lb://service-incidents
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tickets/**,/api/work-orders/**

spring.cloud.gateway.routes[2].id=route-finances
spring.cloud.gateway.routes[2].uri=lb://service-finances
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/charges/**,/api/payments/**
