# ===================================================================
# API Gateway - Profil Statique (Spring Cloud Config)
# Discovery Locator Désactivé + Routes Explicites
# ===================================================================
server.port=8080

# --- Désactivation du Discovery Locator ---
spring.cloud.gateway.discovery.locator.enabled=false

# --- Routes déclaratives explicites vers lb:// ---
spring.cloud.gateway.routes[0].id=service-residents-route
spring.cloud.gateway.routes[0].uri=lb://SERVICE-RESIDENTS
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/residents/**,/api/apartments/**

spring.cloud.gateway.routes[1].id=service-incidents-route
spring.cloud.gateway.routes[1].uri=lb://SERVICE-INCIDENTS
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tickets/**,/api/work-orders/**

spring.cloud.gateway.routes[2].id=service-finances-route
spring.cloud.gateway.routes[2].uri=lb://SERVICE-FINANCES
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/charges/**,/api/payments/**,/api/finances/**

# --- Exposition Actuator ---
management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway
