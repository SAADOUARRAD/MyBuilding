# ===================================================================
# Microservice Residents - Configuration Centralisée (Port 8081)
# ===================================================================
server.port=8081

# --- Base de données H2 en mémoire dédiée ---
spring.datasource.url=jdbc:h2:mem:residentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 & JPA Hibernate ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Identifiant d'instance Eureka ---
eureka.instance.instance-id=${spring.application.name}:${server.port}
