# ===================================================================
# Spring Cloud Config Server (Port 8888)
# ===================================================================
spring.application.name=config-server
server.port=8888

# Profil par défaut : lit directement le dossier config-repo local (100% fiable hors-ligne)
# ainsi que la branche Git distante feature/v4-openfeign
spring.profiles.active=native

# Recherche dans le dossier config-repo local (quel que soit le répertoire de lancement)
spring.cloud.config.server.native.search-locations=file:./config-repo,file:../config-repo,file:${user.dir}/config-repo

# Configuration Git distante de secours
spring.cloud.config.server.git.uri=https://github.com/SAADOUARRAD/MyBuilding.git
spring.cloud.config.server.git.default-label=feature/v4-openfeign
spring.cloud.config.server.git.search-paths=config-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=60

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
