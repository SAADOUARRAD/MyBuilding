# ===================================================================
# Spring Cloud Config Server (Port 8888)
# ===================================================================
spring.application.name=config-server
server.port=8888

# --- Source Git pour les configurations externalisées ---
spring.cloud.config.server.git.uri=https://github.com/SAADOUARRAD/MyBuilding.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=config-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=60

# Pour tester en local hors-ligne avant push GitHub, décommenter la ligne suivante :
# spring.cloud.config.server.git.uri=${user.dir}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
